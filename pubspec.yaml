name: piano_tool
description: A piano learning app with horizontal sheet music and real-time pitch detection
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Audio & Pitch Detection
  flutter_sound: ^9.2.13
  fft: ^0.5.1

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Utilities
  collection: ^1.18.0
  path: ^1.9.0
  synchronized: ^3.4.2
  permission_handler: ^13.0.2
  shared_preferences: ^2.2.2
  http: ^1.2.0
  http_parser: ^4.0.0
  file_picker: ^13.1.0
  record: ^7.1.1
  go_router: ^18.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  mockito: ^5.6.4

flutter:
  uses-material-design: true
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
