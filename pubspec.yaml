name: piano_tool
description: A piano learning app with horizontal sheet music and real-time pitch detection
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio & Pitch Detection
  flutter_sound: ^9.2.13
  fft: ^0.5.1

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Utilities
  collection: ^1.18.0
  path: ^1.9.0
  synchronized: ^3.1.0
  permission_handler: ^11.1.0
  shared_preferences: ^2.2.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
