[build-system]
requires = ["setuptools<67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-tool-backend"
version = "0.1.0"
description = "Piano-Tool ingestion service backend"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy",
    "librosa",
    "soundfile",
    "mir-eval",
    "pretty-midi>=0.2.9",
    "resampy<0.4.4,>=0.2.2",
    "scikit-learn",
    "scipy>=1.4.1",
    "typing-extensions",
    "onnxruntime",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "python-multipart",
    "httpx2",
    "yt-dlp",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "types-requests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PLR", # pylint refactoring
    "PLE", # pylint errors
    "TRY", # tryceratops
    "TID", # flake8-tidy-imports
]
ignore = [
    "TRY003",  # Avoid specifying exception messages outside the class
    "TRY301",  # Abstract raise to an inner function
    "PLR2004", # Magic value used in comparison
    "PLC0415", # Import outside toplevel
]
per-file-ignores = { "tests/*" = ["S101", "TRY003", "PLR2004", "PLC0415"] }

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "(\\.venv|\\.git|__pycache__|\\.mypy_cache|\\.ruff_cache|\\.pytest_cache)"

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["app.routes", "app.main"]
disable_error_code = "untyped-decorator"

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "librosa",
    "librosa.*",
    "soundfile",
    "soundfile.*",
    "mir_eval",
    "mir_eval.*",
    "pretty_midi",
    "pretty_midi.*",
    "resampy",
    "resampy.*",
    "sklearn",
    "sklearn.*",
    "scipy",
    "scipy.*",
    "onnxruntime",
    "onnxruntime.*",
    "fastapi",
    "fastapi.*",
    "pydantic",
    "pydantic.*",
    "uvicorn",
    "uvicorn.*",
    "httpx",
    "httpx.*",
    "yaml",
    "yaml.*",
    "yt_dlp",
    "yt_dlp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

