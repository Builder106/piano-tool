name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Check format
        run: dart format --output=none --set-exit-if-changed .
      - name: Run tests
        run: flutter test

  python:
    name: Python (ruff, black, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          bash backend/scripts/install_basic_pitch.sh
      - name: Install lint tools
        run: python -m pip install ruff black mypy
      - name: Ruff lint
        run: python -m ruff check backend
      - name: Black format check
        run: python -m black --check backend
      - name: Mypy type check
        run: python -m mypy --config-file backend/pyproject.toml backend/app --strict --ignore-missing-imports
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run pytest
        run: python -m pytest -W error backend

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [flutter, python]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.flutter.result }}" != "success" ]] || [[ "${{ needs.python.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed"
