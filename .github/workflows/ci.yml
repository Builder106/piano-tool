name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flutter:
    name: Flutter (analyze, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Check format
        run: dart format --output=none --set-exit-if-changed .
      - name: Run tests
        run: flutter test
      - name: Build web release
        run: flutter build web --release

  android:
    name: Android build + emulator smoke test
    needs: [flutter]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and smoke-test app install/launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb shell monkey -p com.yinkavaughan.piano_tool 1
            sleep 5
            adb shell dumpsys activity activities | grep -q "com.yinkavaughan.piano_tool" || (echo "App did not stay foregrounded" && exit 1)

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: piano-tool-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  python:
    name: Python (ruff, black, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          bash backend/scripts/install_basic_pitch.sh
      - name: Install lint tools
        run: python -m pip install ruff black mypy pytest-cov
      - name: Check dependencies
        run: |
          set +e
          pip_check_output=$(python -m pip check 2>&1)
          pip_check_status=$?
          set -e

          if [ $pip_check_status -ne 0 ]; then
            unresolved=$(echo "$pip_check_output" | grep -v "basic-pitch .* requires tensorflow, which is not installed" || true)
            if [ -n "$unresolved" ]; then
              echo "$pip_check_output"
              exit 1
            fi
            echo "$pip_check_output (expected: onnxruntime used instead of tensorflow)"
          else
            echo "$pip_check_output"
          fi
      - name: Ruff lint
        run: python -m ruff check backend
      - name: Black format check
        run: python -m black --check backend
      - name: Mypy type check
        run: python -m mypy --config-file backend/pyproject.toml backend/app --strict --ignore-missing-imports
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run pytest
        run: >-
          python -m pytest -W error backend
          --cov=app
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=100
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [secrets, flutter, python]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.secrets.result }}" != "success" ]] || [[ "${{ needs.flutter.result }}" != "success" ]] || [[ "${{ needs.python.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed"

  deploy:
    name: Deploy to Vercel
    needs: [summary]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_PROD: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
        run: |
          echo "Deploying to production..."
          curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_PROD"
