[project]
name = "piano-tool-backend"
version = "0.1.0"
description = "Piano-Tool ingestion service backend"
requires-python = "==3.12.*"
dependencies = [
    "numpy",
    "librosa",
    "soundfile",
    "mir-eval",
    "pretty-midi>=0.2.9",
    "resampy<0.4.4,>=0.2.2",
    "scikit-learn",
    "scipy>=1.4.1",
    "typing-extensions",
    "onnxruntime",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "python-multipart",
    "httpx2",
    "yt-dlp",
]
